name: No GPU

on:
  push:
    branches: [deepseek-v41-zig-tp4]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # zig build test is the host unit tests. No GPU. The Python suite is not this check.
      - name: zig build test
        run: zig build test
      # The kernel contract's limits gate: every registered launch against M1-M5 and sm_80/86/89/120/121, controls red.
      - name: zig build test-kernel-contract
        run: zig build test-kernel-contract
      # The frozen server goldens: request parsing, rendering and streaming against recorded answers.
      - name: zig build test-golden
        run: zig build test-golden
      # Cortheon's readers of untrusted web bytes under the fuzz harness: seeds, 100,000 edits, linear time.
      - name: zig build fuzz-cortheon
        run: zig build fuzz-cortheon
      # The lean rule (600-line files, one-line comments within 120 columns): no problem the base branch lacks. A pull
      # request only: a push has no base branch to compare with.
      - name: lean check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base HEAD "origin/$BASE_REF")
          git worktree add --detach ../lean-base "$base"
          cp tools/zig/lean_check.py ../lean-base/tools/zig/lean_check.py
          (cd ../lean-base && python3 tools/zig/lean_check.py > ../lean-base.txt || true)
          python3 tools/zig/lean_check.py > ../lean-head.txt || true
          python3 tools/zig/lean_new.py ../lean-base.txt ../lean-head.txt

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The scripts', the setup's and the tools' tests: no GPU and no Sparks (stand-ins for ssh, docker, sudo and the GPU).
      - name: python tests
        run: python3 -m unittest discover -s tests
      # Every environment name the engine reads has a schema row, and the generated settings table matches the schema.
      - name: settings schema
        run: python3 tools/schema/check_env_schema.py
      # The RDMA copy's own tests, on its loopback backend (no RDMA hardware or headers).
      - name: fabric-xfer tests
        run: make -C tools/fabric-xfer test
